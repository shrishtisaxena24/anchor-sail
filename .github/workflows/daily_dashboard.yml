name: Anchor & Sail daily dashboard

on:
  workflow_dispatch:          # "Run workflow" button
  schedule:
    # Times are UTC. IST = UTC + 5:30. GitHub's scheduler may run 5–20 minutes late.
    - cron: "0,15,30,45 4-9 * * 1-5"   # every 15 min, 09:30–15:15 IST, Mon–Fri — live stop monitoring
    - cron: "0,15 10 * * 1-5"          # 15:30 and 15:45 IST Mon–Fri — closing bar
    - cron: "30 12 * * *"              # 18:00 IST every day — final end-of-day build

concurrency:
  group: anchor-sail-build
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache (reconciliation store)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: |
            prices-

      - name: Build dashboard data
        run: python engine/build.py 2>&1 | tee run.log

      # The dashboard (docs/) is published straight to GitHub Pages from this run — data.json is
      # NOT committed any more, so 25 builds a day do not bloat the repository.
      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Ledgers and universe snapshots are committed only when something material changed
      # (an entry, exit, scale-out, trail or split) or on the end-of-day pass.
      - name: Commit ledger state
        run: |
          git config user.name  "anchor-sail-bot"
          git config user.email "anchor-sail-bot@users.noreply.github.com"
          git rm -q --cached docs/data.json 2>/dev/null || true
          if [ -f data/.commit ]; then
            git add data/state data/universe
            if git diff --cached --quiet; then
              echo "nothing to commit"
            else
              git commit -m "ledger: $(date -u +'%Y-%m-%d %H:%M UTC')"
              git pull --rebase --autostash origin ${{ github.ref_name }} || true
              git push
            fi
          else
            echo "intraday run — ledger unchanged, nothing committed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Build log (tail)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 run.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
