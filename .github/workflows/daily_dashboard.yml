name: Anchor & Sail daily dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4-9 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "30 12 * * *"

concurrency:
  group: anchor-sail-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache (reconciliation store)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: |
            prices-

      - name: Build dashboard data
        run: python engine/build.py 2>&1 | tee run.log

      - name: Commit updated data
        run: |
          git config user.name  "anchor-sail-bot"
          git config user.email "anchor-sail-bot@users.noreply.github.com"
          git add docs/data.json data/state data/universe
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Build log (tail)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 run.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
