<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor & Sail — Live Signals</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0e1a; --bg2:#0d1326; --surface:#111a2e; --surface-2:#16213a; --surface-3:#1b2742; --border:#1f2b47; --border-2:#2a3a5e;
  --text:#e8eefb; --text-2:#9fb0cc; --text-3:#6b7a99;
  --teal:#2dd4bf; --cyan:#38bdf8; --pink:#f472b6; --rose:#fb7185; --green:#34d399; --amber:#fbbf24; --violet:#a78bfa; --blue:#60a5fa;
  --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --good-bg:rgba(52,211,153,.13); --bad-bg:rgba(251,113,133,.14); --warn-bg:rgba(251,191,36,.14); --teal-bg:rgba(45,212,191,.14); --pink-bg:rgba(244,114,182,.14); --violet-bg:rgba(167,139,250,.16); --grey-bg:rgba(159,176,204,.12);
  --s1:var(--teal); --s2:var(--pink);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
body{background:
  radial-gradient(900px 500px at -10% -10%, rgba(56,189,248,.14), transparent 60%),
  radial-gradient(800px 500px at 110% 0%, rgba(167,139,250,.14), transparent 60%),
  radial-gradient(700px 500px at 50% 120%, rgba(244,114,182,.08), transparent 60%),
  var(--bg); min-height:100vh}
a{color:var(--cyan)}
.wrap{max-width:1540px;margin:0 auto;padding:14px 22px 70px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:10px 0 14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#f59e0b);color:#1a1200;font-weight:900;font-size:13px;display:grid;place-items:center;letter-spacing:-.02em;box-shadow:0 0 24px rgba(251,191,36,.25)}
h1{font-size:18px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
h1 small{display:block;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text-2);font-size:12px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--text-2);font-size:12.5px;align-items:center}
.meta b{color:var(--text)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.live{background:var(--good-bg);color:var(--green);box-shadow:0 0 0 1px rgba(52,211,153,.35) inset}
.pill.closed{background:var(--grey-bg);color:var(--text-2)}
.pill.stale{background:var(--warn-bg);color:var(--amber)}
button{font:inherit;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 13px}
button:hover{border-color:var(--teal);color:#fff}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid rgba(251,191,36,.35);font-size:13px}
.banner summary{cursor:pointer;font-weight:600;color:var(--amber)}
.banner ul{margin:8px 0 0;padding-left:18px;color:var(--text-2)}
.banner.err{background:var(--bad-bg);border-color:rgba(251,113,133,.4)} .banner.err summary{color:var(--rose)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 12px}
.tab{border:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--bg2));border-radius:14px;padding:13px 15px;text-align:left;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.tab:hover{border-color:var(--border-2);transform:translateY(-1px)}
.tab.active{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal), 0 10px 40px rgba(45,212,191,.12)}
.tab.active::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),var(--cyan),var(--pink))}
.tab .name{font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.04em}
.tab .name span{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.03em}
.tab .sub{color:var(--text-2);font-size:12px;margin-top:2px}
.tab .row{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.tab .row b{color:var(--text);font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--rose)} .mut{color:var(--text-3)}
.switch{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px;width:max-content;margin:6px 0 4px}
.switch button{border:none;background:transparent;color:var(--text-2);padding:8px 16px;border-radius:9px;font-weight:700;letter-spacing:.03em;font-size:12.5px}
.switch button.on{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#04121a}
.switch button small{display:block;font-weight:500;letter-spacing:0;font-size:11px;opacity:.85}
section{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.sec-h .num{width:28px;height:28px;border-radius:8px;background:var(--teal-bg);color:var(--teal);font-weight:800;display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 1px rgba(45,212,191,.35) inset}
.sec-h h2{font-size:18px;margin:0;font-weight:800}
.sec-h .desc{font-size:12px;color:var(--text-2)}
h3{font-size:11.5px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-2);font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0;overflow:hidden}
.tblwrap{overflow-x:auto;max-height:640px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
th:hover{color:var(--teal)}
th .arrow{opacity:.7;font-size:9px;margin-left:3px;color:var(--teal)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(56,189,248,.06)}
td.sym{font-weight:700;text-align:left;color:#fff}
td.sym small{display:block;font-weight:400;color:var(--text-3);font-size:11px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px;color:var(--text-3);font-size:13px;text-align:center}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em}
.tag.exit{background:var(--bad-bg);color:var(--rose)}
.tag.entry{background:var(--good-bg);color:var(--green)}
.tag.scale{background:var(--warn-bg);color:var(--amber)}
.tag.held{background:var(--teal-bg);color:var(--teal)}
.tag.armed{background:var(--violet-bg);color:var(--violet)}
.tag.pink{background:var(--pink-bg);color:var(--pink)}
.tag.grey{background:var(--grey-bg);color:var(--text-2)}
.tag.today{background:var(--rose);color:#1a0508}
.tag.noslot{background:var(--grey-bg);color:var(--text-2)}
.ok{color:var(--green);font-weight:700} .no{color:var(--text-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:#fff}
.kpi .k{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-top:6px;font-weight:700}
.kpi .d{font-size:11.5px;color:var(--text-2);margin-top:3px}
.kpi .v.teal{color:var(--teal)} .kpi .v.cyan{color:var(--cyan)} .kpi .v.pink{color:var(--pink)} .kpi .v.green{color:var(--green)} .kpi .v.amber{color:var(--amber)} .kpi .v.rose{color:var(--rose)} .kpi .v.violet{color:var(--violet)}
.perf{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1000px){.perf,.two{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 8px}
.chart .t{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chart .t b{font-size:13.5px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
svg{display:block;width:100%;height:auto}
.tt{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border-2);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);display:none;z-index:5;white-space:nowrap;color:var(--text)}
.stats{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 16px}
.stats div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.stats div:last-child{border-bottom:none}
.stats span:first-child{color:var(--text-2)}
.stats span:last-child{font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.toolbar input{font:inherit;padding:7px 12px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface);color:var(--text);min-width:240px}
.toolbar input:focus{outline:none;border-color:var(--teal)}
.toolbar .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--text-2)}
.chip.on{background:var(--teal);color:#04121a;border-color:var(--teal);font-weight:700}
.note{font-size:12px;color:var(--text-3);margin-top:8px;line-height:1.5}
footer{margin-top:34px;color:var(--text-3);font-size:12px;border-top:1px solid var(--border);padding-top:12px;line-height:1.6}
.stopbar{display:inline-block;width:70px;height:6px;background:var(--surface-3);border-radius:3px;vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.stopbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
#loading{padding:60px;text-align:center;color:var(--text-2);line-height:1.7}
.hero{background:linear-gradient(135deg,rgba(45,212,191,.12),rgba(56,189,248,.08) 50%,rgba(244,114,182,.10));border:1px solid var(--border-2);border-radius:14px;padding:14px 18px;margin-bottom:12px;font-size:13.5px;color:var(--text-2)}
.hero b{color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">A&amp;S</div>
      <h1>Anchor &amp; Sail <small>live signal dashboard · four portfolios · live book and 2016→today backtest</small></h1>
    </div>
    <div class="meta" id="meta"></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="mut" id="autoref" style="font-size:12px"></span>
      <button id="refresh">↻ Refresh now</button>
    </div>
  </header>
  <div id="warnings"></div>
  <div id="loading">Loading latest data…</div>
  <div id="tabs" class="tabs" hidden></div>
  <div id="switch" class="switch" hidden></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="tt" id="tt"></div>

<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(v==null) continue; if(k==='class') n.className=v; else if(k==='html') n.innerHTML=v; else if(k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k,v);} for(const k of kids){ if(k==null) continue; n.append(k.nodeType?k:document.createTextNode(k)); } return n; };
const inr = new Intl.NumberFormat('en-IN', {maximumFractionDigits:0});
const inr2 = new Intl.NumberFormat('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const fR = v => v==null ? '—' : (v<0?'−':'') + '₹' + inr.format(Math.abs(v));
const fP = v => v==null ? '—' : inr2.format(v);
const fPct = (v, sign=true) => v==null ? '—' : ((sign && v>0)?'+':'') + v.toFixed(2) + '%';
const fN = (v, d=2) => v==null ? '—' : Number(v).toFixed(d);
const cls = v => v==null ? 'mut' : v>0 ? 'pos' : v<0 ? 'neg' : '';
const pctCell = v => { const t=document.createElement('td'); t.className=cls(v); t.textContent=fPct(v); return t; };
const yesno = b => b==null ? '—' : b ? '✓' : '·';
const lakh = v => v==null ? '—' : (v<0?'−':'') + '₹' + (Math.abs(v)>=1e7 ? (Math.abs(v)/1e7).toFixed(2)+' Cr' : (Math.abs(v)/1e5).toFixed(1)+' L');

let DATA=null, active = localStorage.getItem('as_tab') || 'CORE', view = localStorage.getItem('as_view') || 'live';

async function load(){
  try{
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
    render();
  }catch(e){
    $('#loading').innerHTML = '<b>No data yet</b> (' + e.message + ').<br><br>If this is a fresh setup: go to the repository → <b>Actions</b> → <b>Anchor &amp; Sail daily dashboard</b> → <b>Run workflow</b>, wait ~5 minutes, then reload this page.<br>If you opened index.html from your disk, open the GitHub Pages URL instead — a browser cannot read data.json from a local file.';
  }
}

function render(){
  const D = DATA;
  $('#loading').hidden = true;
  const live = D.market_status.startsWith('LIVE');
  const st = el('span', {class:'pill ' + (live?'live':(D.market_status.startsWith('Closed')?'closed':'stale'))}, D.market_status);
  $('#meta').replaceChildren(
    el('span', {}, 'Data as of ', el('b', {}, D.data_date)), st,
    el('span', {}, 'Nifty 50 ', el('b', {}, fP(D.nifty.close)), ' ', el('span', {class:cls(D.nifty.chg_pct)}, fPct(D.nifty.chg_pct))),
    el('span', {}, 'Signal month ', el('b', {}, D.completed_month), ' · running ', el('b', {}, D.running_month)),
    el('span', {}, 'Built ', el('b', {}, D.generated_at_ist))
  );
  const W = $('#warnings'); W.replaceChildren();
  if(D.warnings && D.warnings.length){
    const mock = D.warnings.some(w=>w.startsWith('MOCK'));
    const det = el('details', {class:'banner' + (mock?' err':'')});
    if(mock) det.setAttribute('open','');
    det.append(el('summary', {}, `${D.warnings.length} data warning${D.warnings.length>1?'s':''} — click to expand`),
               el('ul', {}, ...D.warnings.map(w=>el('li', {}, w))));
    W.append(det);
  }
  const T = $('#tabs'); T.hidden=false; T.replaceChildren();
  for(const [k,P] of Object.entries(D.portfolios)){
    const pf = P.performance, bt = P.backtest;
    const exitsToday = P.exits.filter(e=>e.today).length;
    const b = el('button', {class:'tab' + (k===active?' active':''), onclick:()=>{active=k; localStorage.setItem('as_tab',k); render();}},
      el('div', {class:'name'}, P.name, el('span', {}, `${P.universe_label} · RANK ${P.ranking?'ON':'OFF'}`)),
      el('div', {class:'sub'}, `vs ${P.benchmark}`),
      el('div', {class:'row'},
        el('span', {}, 'Live ', el('b', {class:cls(pf.return_pct)}, fPct(pf.return_pct))),
        el('span', {}, 'Bench ', el('b', {class:cls(pf.bench_return_pct)}, fPct(pf.bench_return_pct))),
        el('span', {}, 'Open ', el('b', {}, `${pf.open_positions}/${pf.slots}`)),
        el('span', {}, 'Exits today ', el('b', {class: exitsToday?'neg':''}, exitsToday)),
        bt ? el('span', {}, 'Backtest CAGR ', el('b', {class:'pos'}, fPct(bt.metrics.cagr_pct,false))) : null
      ));
    T.append(b);
  }
  const P = D.portfolios[active];
  const SW = $('#switch'); SW.hidden=false; SW.replaceChildren(
    el('button', {class: view==='live'?'on':'', onclick:()=>{view='live'; localStorage.setItem('as_view',view); render();}}, 'LIVE BOOK', el('small',{}, `since ${P.inception} · daily stops`)),
    el('button', {class: view==='bt'?'on':'', onclick:()=>{view='bt'; localStorage.setItem('as_view',view); render();}}, 'BACKTEST', el('small',{}, P.backtest ? `${P.backtest.start} → ${P.backtest.as_of}` : 'not available'))
  );
  if(view==='bt' && P.backtest) renderBacktest(P); else renderPortfolio(P);
  $('#foot').innerHTML = `Strategy: monthly bars · Williams %R(${D.strategy.wr_len}) armed &lt; ${D.strategy.arm}, trigger ≥ ${D.strategy.trigger} · EMA 5 &gt; 15 &gt; 50 · stop −15% · target +30% (50% scale-out, stop to breakeven, then trails previous month's low) · ${D.strategy.slots} slots · size = corpus/25 · idle cash in Nifty 50 ETF (^NSEI) · Indian delivery costs applied.<br>
  Entry signals are generated <b>once a month</b> on the completed close (running month excluded) — the entry table stays the same all month by design. The open book and its stops are re-checked on every run. Universe = today's index members (survivorship bias vs the benchmark is present and unquantified). Prices: Yahoo Finance via yfinance, adjusted. Build time ${D.runtime_sec}s.`;
}

function sortable(table, rows, cols, renderRow, defaultKey, defaultDesc){
  let key=defaultKey, desc=!!defaultDesc;
  const thead = el('thead'); const tbody = el('tbody');
  const draw = () => {
    const rs = rows.slice();
    if(key){ rs.sort((a,b)=>{ const x=a[key], y=b[key]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (typeof x==='number'? x-y : String(x).localeCompare(String(y))) * (desc?-1:1); }); }
    tbody.replaceChildren(...rs.map(renderRow));
    thead.querySelectorAll('th').forEach(th=>{ const a=th.querySelector('.arrow'); if(a) a.textContent = th.dataset.key===key ? (desc?'▼':'▲') : ''; });
  };
  const tr = el('tr');
  for(const c of cols){
    const th = el('th', {class: c.left?'l':'', 'data-key': c.key||'', title: c.title||''}, c.label, el('span', {class:'arrow'}, ''));
    if(c.key) th.addEventListener('click', ()=>{ if(key===c.key) desc=!desc; else {key=c.key; desc = c.desc!==false;} draw(); });
    tr.append(th);
  }
  thead.append(tr); table.append(thead, tbody); draw();
  return draw;
}
function tableCard(rows, cols, renderRow, emptyMsg, sortKey, sortDesc){
  const card = el('div', {class:'card'});
  if(!rows.length){ card.append(el('div', {class:'empty'}, emptyMsg)); return card; }
  const wrap = el('div', {class:'tblwrap'}); const table = el('table');
  sortable(table, rows, cols, renderRow, sortKey, sortDesc); wrap.append(table); card.append(wrap); return card;
}
function symCell(r){ const td=el('td',{class:'sym'}, r.symbol); if(r.name) td.append(el('small',{}, r.name)); return td; }
function td(v, c){ const t=el('td', {class:c||''}); t.textContent = v; return t; }
function secHead(n, title, desc){ return el('div', {class:'sec-h'}, el('span',{class:'num'}, n), el('h2', {}, title), desc? el('span', {class:'desc'}, desc):null); }
const kpi = (v, k, d, c) => el('div', {class:'kpi'}, el('div',{class:'v '+(c||'')},v), el('div',{class:'k'},k), d? el('div',{class:'d'},d):null);
const signCol = v => v==null ? '' : v>0 ? 'green' : v<0 ? 'rose' : '';

// =============================================================== LIVE VIEW
function renderPortfolio(P){
  const M = $('#main'); M.replaceChildren();
  const D = DATA, pf = P.performance;

  const s1 = el('section');
  s1.append(secHead('1', `Signals — ${P.name}`, `${P.universe_label} (${P.universe_size} stocks) · ranking ${P.ranking?'ON':'OFF'} · ₹${inr.format(P.capital)} committed ${P.inception}`));
  s1.append(el('h3', {}, `Exit signals — stops / targets hit (this month${P.exits.some(e=>e.today)?', today highlighted':''})`));
  s1.append(tableCard(P.exits, [
      {label:'Stock', left:true, key:'symbol'}, {label:'Action', key:'type'}, {label:'Date', key:'date'}, {label:'Reason', key:'reason', left:true},
      {label:'Entry date', key:'entry_date'}, {label:'Entry ₹', key:'entry'}, {label:'Qty', key:'qty'}, {label:'Exit ₹', key:'price'},
      {label:'Stop was', key:'stop'}, {label:'P&L %', key:'pnl_pct'}, {label:'Realised ₹', key:'realised'}],
    r => { const tr=el('tr'); tr.append(symCell(r),
        el('td',{}, el('span',{class:'tag '+(r.type==='EXIT'?'exit':'scale')}, r.type), r.today? el('span',{class:'tag today', style:'margin-left:4px'},'TODAY'):null),
        td(r.date), td(r.reason,'l'), td(r.entry_date), td(fP(r.entry)), td(inr.format(r.qty)), td(fP(r.price)), td(fP(r.stop)), pctCell(r.pnl_pct),
        td(r.realised==null?'—':fR(r.realised), cls(r.realised))); return tr; },
    'No stop or target has been hit this month. Open positions and their live stop levels are listed below.', 'date', true));

function openBookTable(rows, withWr){
  const cols = [
      {label:'Stock', left:true, key:'symbol'}, {label:'Entry date', key:'entry_date'}, {label:'Entry ₹', key:'entry'}, {label:'Qty held', key:'qty_open'},

      {label:'LTP above stop', key:'to_stop_pct', desc:false, title:'How far the last price sits above the stop. Red when within 5%.'},
      {label:'Target ₹', key:'target'}, {label:'To target', key:'to_target_pct'}, {label:'Scaled', key:'scaled'}];
  if(withWr) cols.push({label:'Day low', key:'day_low'}, {label:'%R now', key:'wr_p', title:'Running-month %R(14), provisional'}); else cols.push({label:'Months held', key:'months'});

    r => { const tr=el('tr'); const near = r.to_stop_pct!=null && r.to_stop_pct<=5;
        const bar = el('span',{class:'stopbar'}); const w = r.to_stop_pct==null?0:Math.max(0,Math.min(100, r.to_stop_pct/20*100)); bar.append(el('i',{style:`width:${w}%;background:${near?'var(--rose)':'var(--teal)'}`}));
        tr.append(symCell(r), td(r.entry_date), td(fP(r.entry)), td(inr.format(r.qty_open)), td(fP(r.ltp)), pctCell(r.pnl_pct), td(fR(r.unrealised), cls(r.unrealised)), td(fR(r.value)),
          td(fP(r.stop)), el('td',{class: near?'neg':''}, fPct(r.to_stop_pct,false), bar), td(fP(r.target)),
          td(r.to_target_pct==null?(r.scaled?'done':'—'):fPct(r.to_target_pct,false)), el('td',{}, r.scaled? el('span',{class:'tag scale'},'50% OUT'):'·'));
        if(withWr) tr.append(td(fP(r.day_low)), td(fP(r.wr_p))); else tr.append(td(r.months));
        return tr; },
    'No open positions.', 'to_stop_pct', false);
}

// =============================================================== generic line chart (SVG, hover crosshair)
function lineChart({title, dates, series, fmt, base, area=false, extra, minPts=2, height=280, yMax, wide=false, padTop=true, padBottom=true}){
  const card = el('div', {class:'chart'});
  card.append(el('div', {class:'t'}, el('b', {}, title), el('div', {class:'legend'}, ...series.map(s=>el('span',{}, el('i',{style:`background:${s.color}`}), s.name)))));
  const n = dates.length;
  if(n < minPts){ card.append(el('div',{class:'empty'}, 'The curve appears once there are at least two data points.')); return card; }
  const W=wide?1240:760, Hh=height, pl=wide?70:58, pr=14, pt=14, pb=28;
  const vals = series.flatMap(s=>s.values).filter(v=>v!=null);
  let lo=Math.min(...vals), hi=Math.max(...vals); if(yMax!=null) hi=Math.max(hi,yMax); if(base!=null){ lo=Math.min(lo,base); hi=Math.max(hi,base);} const pad=(hi-lo)*0.06||1; if(padBottom) lo-=pad; if(padTop) hi+=pad;
  const x = i => pl + (W-pl-pr) * (n===1?0:i/(n-1));
  const y = v => pt + (Hh-pt-pb) * (1 - (v-lo)/(hi-lo));
  const ns = (t, a) => { const e=document.createElementNS('http://www.w3.org/2000/svg', t); for(const [k,v] of Object.entries(a)) e.setAttribute(k,v); return e; };
  const svg = ns('svg', {viewBox:`0 0 ${W} ${Hh}`});
  const ticks = 4;
  for(let k=0;k<=ticks;k++){ const v = lo + (hi-lo)*k/ticks; svg.append(ns('line',{x1:pl,x2:W-pr,y1:y(v),y2:y(v),stroke:'var(--border)','stroke-width':1}));
    const t = ns('text',{x:pl-8,y:y(v)+4,'text-anchor':'end',fill:'var(--text-3)','font-size':11}); t.textContent=fmt(v); svg.append(t); }
  if(base!=null) svg.append(ns('line',{x1:pl,x2:W-pr,y1:y(base),y2:y(base),stroke:'var(--border-2)','stroke-dasharray':'3 3'}));
  const nx = Math.min(7, n); for(let k=0;k<nx;k++){ const i=Math.round((n-1)*k/(nx-1||1)); const t=ns('text',{x:x(i),y:Hh-8,'text-anchor':k===0?'start':k===nx-1?'end':'middle',fill:'var(--text-3)','font-size':11}); t.textContent = n>40? dates[i].slice(0,7) : dates[i].slice(5); svg.append(t); }
  const defs = ns('defs',{}); svg.append(defs);
  series.slice().reverse().forEach((s, ri) => {
    const pts = s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(pts.length<2) return;
    const d = pts.map((p,k)=>`${k?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    if(area && ri===series.length-1){ const gid='g'+Math.random().toString(36).slice(2); const g=ns('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1}); g.append(ns('stop',{offset:'0%','stop-color':s.color,'stop-opacity':.35}), ns('stop',{offset:'100%','stop-color':s.color,'stop-opacity':0})); defs.append(g);
      const yb = y(base!=null ? base : lo); svg.append(ns('path',{d:`${d} L${pts[pts.length-1][0].toFixed(1)},${yb.toFixed(1)} L${pts[0][0].toFixed(1)},${yb.toFixed(1)} Z`, fill:`url(#${gid})`})); }
    svg.append(ns('path',{d, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round'}));
  });
  const cross = ns('line',{x1:0,x2:0,y1:pt,y2:Hh-pb,stroke:'var(--text-3)','stroke-width':1,opacity:0});
  const dots = series.map(s=>ns('circle',{r:4,fill:s.color,stroke:'var(--surface)','stroke-width':2,opacity:0}));
  svg.append(cross, ...dots);
  const tt = $('#tt');
  svg.addEventListener('mousemove', ev => { const r = svg.getBoundingClientRect(); const fx = (ev.clientX - r.left) / r.width * W; const i = Math.max(0, Math.min(n-1, Math.round((fx-pl)/(W-pl-pr)*(n-1))));
    cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i)); cross.setAttribute('opacity',1);
    let html = `<b>${dates[i]}</b>`;
    series.forEach((s,k)=>{ const v=s.values[i]; if(v==null){ dots[k].setAttribute('opacity',0); return; } dots[k].setAttribute('cx',x(i)); dots[k].setAttribute('cy',y(v)); dots[k].setAttribute('opacity',1); html += `<br><span style="color:${s.color}">●</span> ${s.name}: ${fmt(v)}`; });
    if(extra) html += ` <span class="mut">${extra(i)}</span>`;
    tt.innerHTML = html; tt.style.display='block'; tt.style.left = (ev.pageX + 14) + 'px'; tt.style.top = (ev.pageY - 10) + 'px'; });
  svg.addEventListener('mouseleave', ()=>{ tt.style.display='none'; cross.setAttribute('opacity',0); dots.forEach(d=>d.setAttribute('opacity',0)); });
  card.append(svg);
  return card;
}

$('#refresh').addEventListener('click', load);
let secs = 300; setInterval(()=>{ secs--; if(secs<=0){ secs=300; load(); } $('#autoref').textContent = `auto-refresh in ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`; }, 1000);
load();
})();
</script>
